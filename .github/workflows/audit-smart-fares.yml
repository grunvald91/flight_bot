name: Read-only live international fare API smoke test
on:
  push:
    branches: [audit/alerts-production-20261124]
    paths: [".github/workflows/audit-smart-fares.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify source supports origin-only round-trip date search
        uses: appleboy/ssh-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            set -e
            cd /opt/flight_bot
            venv/bin/python - <<'PY'
            import datetime, json, os, re, subprocess, urllib.parse, urllib.request, urllib.error
            from zoneinfo import ZoneInfo
            pid = subprocess.check_output(["systemctl","show","-p","MainPID","--value","flight-bot"],text=True).strip()
            with open("/proc/" + pid + "/environ","rb") as f:
                env = dict(item.split(b"=",1) for item in f.read().split(b"\0") if b"=" in item)
            token = env.get(b"TRAVELPAYOUTS_TOKEN",b"").decode()
            if not token:
                from dotenv import dotenv_values
                token = dotenv_values("/opt/flight_bot/.env").get("TRAVELPAYOUTS_TOKEN") or ""
            if not token:
                from bot.config import TRAVELPAYOUTS_TOKEN
                token = TRAVELPAYOUTS_TOKEN
            if not token:
                raise SystemExit("Source token unavailable to read-only test")
            today = datetime.datetime.now(ZoneInfo("Europe/Moscow")).date()
            found = False
            for offset in (3, 7, 14):
                departure = (today + datetime.timedelta(days=offset)).isoformat()
                returning = (today + datetime.timedelta(days=offset+5)).isoformat()
                query = urllib.parse.urlencode({"origin":"MOW","departure_at":departure,"return_at":returning,
                    "one_way":"false","unique":"true","direct":"false","sorting":"price","currency":"rub","limit":1000,"page":1,"token":token})
                request = urllib.request.Request("https://api.travelpayouts.com/aviasales/v3/prices_for_dates?" + query,
                    headers={"X-Access-Token":token})
                try:
                    with urllib.request.urlopen(request,timeout=15) as response:
                        data = json.load(response)
                except urllib.error.HTTPError as exc:
                    print("Source HTTP status:",exc.code)
                    continue
                except Exception as exc:
                    print("Source request failed:",type(exc).__name__)
                    continue
                if not isinstance(data,dict) or data.get("success") is not True or not isinstance(data.get("data"),list):
                    print("Invalid source response")
                    continue
                rows = data["data"]
                exact = [r for r in rows if isinstance(r,dict) and str(r.get("departure_at",""))[:10] == departure
                    and str(r.get("return_at",""))[:10] == returning and re.fullmatch(r"[A-Z]{3}",str(r.get("destination","")))
                    and isinstance(r.get("price"),(int,float)) and r["price"] > 0]
                print("Round trip:",departure,returning,"rows:",len(rows),"exact dated prices:",len(exact),
                    "currency valid:",str(data.get("currency","rub")).lower()=="rub")
                if exact and str(data.get("currency","rub")).lower()=="rub":
                    found = True
                    print("Exact dates and destination fields verified")
                    break
            if not found:
                raise SystemExit("No matching round-trip fare verified")
            PY
