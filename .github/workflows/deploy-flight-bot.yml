name: Deploy flight bot to 188

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-flight-bot.yml"
      - "bot/main.py"
      - "bot/handlers/common.py"
      - "bot/handlers/month.py"
      - "bot/services/aviasales_api.py"
      - "bot/handlers/browse.py"
      - "bot/services/discovery_archive.py"
      - "bot/widgets/**"

permissions:
  contents: read

# Два деплоя одновременно не запускаются, и идущий деплой не обрывается на середине
concurrency:
  group: deploy-flight-bot
  cancel-in-progress: false

env:
  # Единый список файлов: по нему делается резервная копия, загрузка и откат.
  # Правила въезда (entry.py, entry_rules.py) вручную сверяются с источниками, см. VERIFIED_COUNTRY_RULES (21 страна); поиск по стране вместо города, названия стран
  DEPLOY_FILES: "bot/config.py,bot/main.py,bot/handlers/admin.py,bot/handlers/common.py,bot/handlers/travel.py,bot/handlers/entry.py,bot/handlers/browse.py,bot/handlers/discover.py,bot/handlers/month.py,bot/keyboards/common_kb.py,bot/states/search.py,bot/services/scheduler.py,bot/services/channel_publisher.py,bot/services/tutu_mcp.py,bot/services/entry_rules.py,bot/services/fast_browse.py,bot/services/discovery_archive.py,bot/services/aviasales_api.py,bot/services/search_prefs.py,bot/services/countries.py,bot/services/country_search.py,bot/widgets/__init__.py,bot/widgets/browse.py,bot/widgets/browse.html,database/crud.py,database/database.py,database/models.py,data/kdmid_entry_rules.csv"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Сайт МИД бывает на регламентных работах. Тогда деплой не останавливается:
      # снимок не обновляется, а на сервере остаётся прежний файл правил.
      - name: Refresh official KDMID entry-rules snapshot
        id: kdmid
        continue-on-error: true
        run: python scripts/fetch_kdmid_entry_rules.py

      - name: Skip the entry-rules file if it was not refreshed
        if: steps.kdmid.outcome != 'success'
        run: |
          echo "::warning::KDMID недоступен — файл правил въезда на сервере не обновляется"
          echo "DEPLOY_FILES=$(echo "$DEPLOY_FILES" | tr ',' '\n' | grep -vx 'data/kdmid_entry_rules.csv' | paste -sd, -)" >> "$GITHUB_ENV"

      - name: Back up files that will be replaced
        uses: appleboy/ssh-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/flight_bot
            BACKUP_DIR=/opt/flight_bot/.deploy_backups/${{ github.sha }}
            mkdir -p "$BACKUP_DIR"
            : > "$BACKUP_DIR/new_files.txt"
            for f in $(echo "${{ env.DEPLOY_FILES }}" | tr ',' ' '); do
              if [ -e "$f" ]; then
                mkdir -p "$BACKUP_DIR/files/$(dirname "$f")"
                cp -p "$f" "$BACKUP_DIR/files/$f"
              else
                echo "$f" >> "$BACKUP_DIR/new_files.txt"
              fi
            done
            echo "Backup: $BACKUP_DIR"
            echo "New files:"; cat "$BACKUP_DIR/new_files.txt"

      - name: Upload changed files
        uses: appleboy/scp-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          source: ${{ env.DEPLOY_FILES }}
          target: "/opt/flight_bot"
          overwrite: true

      - name: Restart and verify (roll back on failure)
        uses: appleboy/ssh-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          script: |
            cd /opt/flight_bot
            BACKUP_DIR=/opt/flight_bot/.deploy_backups/${{ github.sha }}

            WIDGET_DROPIN=/etc/systemd/system/flight-bot.service.d/60-html-bubbles.conf
            WIDGET_DROPIN_BACKUP="$BACKUP_DIR/html-bubbles-dropin.bak"
            WIDGET_DROPIN_CREATED="$BACKUP_DIR/html-bubbles-dropin-created"

            rollback() {
              echo "!!! $1 — откатываю на прежние файлы"
              cp -rp "$BACKUP_DIR/files/." /opt/flight_bot/
              while read -r f; do [ -n "$f" ] && rm -f "/opt/flight_bot/$f"; done < "$BACKUP_DIR/new_files.txt"
              if [ -f "$WIDGET_DROPIN_BACKUP" ]; then
                cp -p "$WIDGET_DROPIN_BACKUP" "$WIDGET_DROPIN"
              elif [ -f "$WIDGET_DROPIN_CREATED" ]; then
                rm -f "$WIDGET_DROPIN"
              fi
              systemctl daemon-reload
              systemctl restart flight-bot
              sleep 5
              systemctl --no-pager --full status flight-bot | head -n 20
              exit 1
            }

            # Enable the feature for the real production bot, without editing the
            # existing service credentials, .env files, or other systemd units.
            # Keep a separate backup of the drop-in for rollback.
            install -d -m 755 /etc/systemd/system/flight-bot.service.d
            if [ -f "$WIDGET_DROPIN" ]; then
              cp -p "$WIDGET_DROPIN" "$WIDGET_DROPIN_BACKUP"
            else
              touch "$WIDGET_DROPIN_CREATED"
            fi
            printf '%s\n' '[Service]' 'Environment="FLIGHT_BOT_HTML_BUBBLES=1"' 'Environment="FLIGHT_BOT_WIDGET_API=production"' > "$WIDGET_DROPIN"
            chmod 644 "$WIDGET_DROPIN"
            systemctl daemon-reload || rollback "не удалось перечитать конфигурацию systemd"

            venv/bin/python -m compileall -q bot database || rollback "код не компилируется"
            # Проверяем, что все модули импортируются (ловит отсутствующие файлы), бот при этом не запускается
            venv/bin/python -c "import bot.main" || rollback "ошибка импорта"

            STARTED_AT=$(date +%s)
            systemctl restart flight-bot

            # Ждём строку «Bot started» из лога: она пишется после миграции БД и загрузки справочников
            for i in $(seq 1 30); do
              sleep 2
              if journalctl -u flight-bot --since "@$STARTED_AT" --no-pager | grep -q "Bot started"; then
                break
              fi
            done
            journalctl -u flight-bot --since "@$STARTED_AT" --no-pager | grep -q "Bot started" \
              || rollback "бот не запустился за 60 секунд"

            sleep 5
            systemctl is-active --quiet flight-bot || rollback "бот упал после запуска"
            # Verify the *running process* inherited the feature flag, not just
            # the systemd unit file. Never print environment variables or secrets.
            MAIN_PID=$(systemctl show -P MainPID flight-bot)
            [ -n "$MAIN_PID" ] && [ "$MAIN_PID" -gt 0 ] || rollback "не найден процесс flight-bot"
            grep -azqFx 'FLIGHT_BOT_HTML_BUBBLES=1' "/proc/$MAIN_PID/environ" || rollback "процесс бота не получил флаг HTML bubbles"
            systemctl --no-pager --full status flight-bot | head -n 20
            echo "Telegram Widget API capability (sanitized):"
            journalctl -u flight-bot --since "@$STARTED_AT" --no-pager -o cat | grep 'Widget API probe:' | tail -n 1 || true
            echo "Deploy OK; HTML bubbles enabled. Backup kept at $BACKUP_DIR"
