name: Diag browse (temporary)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diag-browse.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          script: |
            cd /opt/flight_bot
            journalctl -u flight-bot --since "-15min" --no-pager | grep -i -E "Bot started|Traceback|ImportError" | tail -3
            venv/bin/python - <<'PY'
            import asyncio, time
            from bot.services.city_resolver import city_resolver
            from bot.services.countries import resolve_country, country_label
            from bot.services.country_search import search_cheapest_to_country
            from bot.services.fast_browse import load_indicative_destinations, visible_options
            async def main():
                await city_resolver.load()
                print("resolve:", {t: resolve_country(t) for t in ["Турция", "ОАЭ", "Грузия", "Армения", "Таиланд", "Сочи"]})
                for country, direct in (("TR", False), ("TR", True), ("AE", False), ("AM", False)):
                    t = time.time()
                    tk = await search_cheapest_to_country("AER", country, days=30, direct_only=direct)
                    dt = time.time() - t
                    cities = sorted({x["destination"] for x in tk})
                    print(f"{country} direct={direct}: {len(tk)} tickets, {len(cities)} cities {cities[:12]}, {dt:.1f}s")
                    for x in tk[:3]:
                        print("   ", x["destination"], city_resolver.get_city_name(x["destination"]), x["price"], x["departure_at"][:16], x.get("transfers"))
                t = time.time()
                res = await load_indicative_destinations("AER", __import__("datetime").date.today().replace().isoformat())
                print(f"browse today: options={len(res.options)} direct_checked={res.direct_checked} {time.time()-t:.1f}s")
            asyncio.run(main())
            PY
