name: Diag browse (temporary)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diag-browse.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          script: |
            cd /opt/flight_bot
            D=$(TZ=Europe/Moscow date -d tomorrow +%F)
            M=$(TZ=Europe/Moscow date -d "tomorrow" +%Y-%m)
            DATE=$D MONTH=$M venv/bin/python - <<'PY'
            import asyncio, json, os, time
            from bot.services.aviasales_api import aviasales_api as api
            D, M = os.environ["DATE"], os.environ["MONTH"]
            country = {c["code"]: c.get("country_code") for c in json.load(open("data/cities.json", encoding="utf-8"))}
            async def q(**kw):
                params = {"currency": "rub", "one_way": "true", "token": api.token, "sorting": "price"}
                params.update(kw)
                t = time.time()
                data = await api._request("/aviasales/v3/prices_for_dates", params)
                dt = time.time() - t
                rows = data.get("data") if isinstance(data, dict) else None
                return rows, dt
            async def main():
                print("date", D, "month", M)
                print("--- per-route on date (direct true / false)")
                for dest in ["TBS", "EVN", "MSQ", "GYD", "TAS", "ALA", "NQZ", "DXB", "SHJ", "FRU", "IST", "AYT", "DLM", "BJV"]:
                    r1, t1 = await q(origin="AER", destination=dest, departure_at=D, direct="true", unique="false", limit=30)
                    r2, t2 = await q(origin="AER", destination=dest, departure_at=D, direct="false", unique="false", limit=30)
                    f = lambda r: (len(r), min(x["price"] for x in r)) if r else (0, None)
                    print(f"{dest}: direct={f(r1)} {t1:.1f}s | any={f(r2)} {t2:.1f}s")
                print("--- parallel: 12 routes at once")
                t = time.time()
                res = await asyncio.gather(*[q(origin="AER", destination=d, departure_at=D, direct="true", unique="false", limit=30)
                                             for d in ["TBS","EVN","MSQ","GYD","TAS","ALA","NQZ","DXB","SHJ","FRU","IST","AYT"]])
                print(f"12 parallel took {time.time()-t:.1f}s, non-empty={sum(1 for r,_ in res if r)}, none={sum(1 for r,_ in res if r is None)}")
                print("--- month, origin only")
                for uniq in ("true", "false"):
                    for direct in ("false", "true"):
                        rows, dt = await q(origin="AER", departure_at=M, direct=direct, unique=uniq, limit=1000)
                        dests = {x["destination"] for x in rows or []}
                        tr = {d for d in dests if country.get(d) == "TR"}
                        print(f"month unique={uniq} direct={direct}: rows={len(rows or [])} dest={len(dests)} TR={sorted(tr)} {dt:.1f}s")
                print("--- month per route (Turkey)")
                for dest in ["IST", "AYT", "DLM", "BJV", "ADB", "SAW", "ESB", "TZX"]:
                    rows, dt = await q(origin="AER", destination=dest, departure_at=M, direct="false", unique="false", limit=1000)
                    print(f"{dest}: rows={len(rows or [])} min={min((x['price'] for x in rows), default=None)} {dt:.1f}s")
            asyncio.run(main())
            PY
