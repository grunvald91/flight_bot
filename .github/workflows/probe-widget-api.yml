name: Probe Telegram HTML widget API

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-widget-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live API method availability without sending messages
        uses: appleboy/ssh-action@v1
        with:
          host: 188.120.254.223
          username: root
          password: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
          script: |
            set -eu
            python3 - <<'PY'
            import json
            import subprocess
            from pathlib import Path
            from urllib.error import HTTPError, URLError
            from urllib.request import Request, urlopen

            pid = subprocess.check_output(
                ["systemctl", "show", "-P", "MainPID", "flight-bot"], text=True
            ).strip()
            if not pid.isdigit() or pid == "0":
                raise SystemExit("flight-bot is not running; no API probe made")
            process_env = Path("/proc/" + pid + "/environ").read_bytes().split(b"\0")
            token = next(
                (item.split(b"=", 1)[1].decode("utf-8")
                 for item in process_env if item.startswith(b"BOT_TOKEN=")), None
            )
            if not token:
                raise SystemExit("BOT_TOKEN not found in running bot environment")

            payload = json.dumps({"html": "<html><body>non-delivery probe</body></html>"}).encode()
            endpoints = [
                ("production", "https://api.telegram.org/bot" + token + "/sendWidget"),
                ("sandbox_beta", "https://api.telegram.org/beta/bot" + token + "/test/sendWidget"),
                ("official_test", "https://api.telegram.org/bot" + token + "/test/sendWidget"),
            ]
            # No chat_id, so none of these requests can deliver a message.
            for label, url in endpoints:
                req = Request(url, data=payload, headers={"Content-Type": "application/json"})
                try:
                    with urlopen(req, timeout=12) as response:
                        status, body = response.status, response.read()
                except HTTPError as err:
                    status, body = err.code, err.read()
                except (URLError, TimeoutError):
                    print(label + ": NETWORK_ERROR", flush=True)
                    continue
                try:
                    result = json.loads(body)
                    desc = str(result.get("description", "")).lower()
                except (ValueError, AttributeError):
                    desc = ""
                if status == 400 and "chat_id" in desc:
                    diagnosis = "METHOD_RECOGNIZED_MISSING_CHAT_ID"
                elif status == 404:
                    diagnosis = "METHOD_OR_ENDPOINT_NOT_FOUND"
                elif status in (401, 403):
                    diagnosis = "TOKEN_NOT_AUTHORIZED_IN_THIS_ENVIRONMENT"
                elif status == 400:
                    diagnosis = "BAD_REQUEST_UNCLASSIFIED"
                else:
                    diagnosis = "OTHER_RESPONSE"
                # Never log the token-bearing URL, exception or raw response body.
                print(f"{label}: HTTP {status}; {diagnosis}", flush=True)
            PY
