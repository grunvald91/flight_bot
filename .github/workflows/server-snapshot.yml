name: Snapshot live flight bot

on:
  push:
    branches:
      - ops/server-snapshot-20261002

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: 188.120.254.223
      SSH_USER: root
      SSH_PASSWORD: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
      REMOTE_PATH: /opt/flight_bot
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SSH secret
        run: |
          if [ -z "$SSH_PASSWORD" ]; then
            echo "FLIGHT_BOT_SSH_PASSWORD secret is not configured"
            exit 2
          fi

      - name: Prepare SSH client
        run: python -m pip install --disable-pip-version-check -q paramiko

      - name: Download source snapshot from production
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          import hashlib
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          import paramiko

          host = os.environ["SSH_HOST"]
          user = os.environ["SSH_USER"]
          password = os.environ["SSH_PASSWORD"]
          remote_root = os.environ["REMOTE_PATH"].rstrip("/")

          target = Path("/tmp/flight_bot_live")
          target.mkdir(parents=True, exist_ok=True)

          allowed_dirs = {"bot", "database", "data", "tests"}
          allowed_root_files = {
              ".gitignore", ".env.example", "README.md", "USER_GUIDE.md",
              "requirements.txt", "flight_bot.service", "main.py"
          }
          excluded_names = {".env", ".env.local", ".env.production", "authorized_keys", "id_rsa", "id_ed25519"}
          excluded_suffixes = {".db", ".sqlite", ".sqlite3", ".log", ".pem", ".key", ".crt", ".p12", ".pfx"}
          max_file_size = 5 * 1024 * 1024

          manifest = []
          top_level = []

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(hostname=host, username=user, password=password, timeout=20, auth_timeout=20, banner_timeout=20)
          sftp = client.open_sftp()

          def safe_file(name, size):
              if name in excluded_names or size > max_file_size:
                  return False
              lower = name.lower()
              return not any(lower.endswith(sfx) for sfx in excluded_suffixes)

          def copy_file(remote_path, rel_path, attr):
              if not safe_file(attr.filename, attr.st_size):
                  return
              local_path = target / rel_path
              local_path.parent.mkdir(parents=True, exist_ok=True)
              sftp.get(remote_path, str(local_path))
              data = local_path.read_bytes()
              manifest.append({
                  "path": str(rel_path),
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "mtime_utc": datetime.fromtimestamp(attr.st_mtime, tz=timezone.utc).isoformat(),
              })

          def walk(remote_dir, rel):
              for attr in sftp.listdir_attr(remote_dir):
                  name = attr.filename
                  remote_path = remote_dir + "/" + name
                  rel_path = rel / name
                  if stat.S_ISDIR(attr.st_mode):
                      if name in {"__pycache__", ".pytest_cache", ".git", "venv", ".venv"}:
                          continue
                      walk(remote_path, rel_path)
                  elif stat.S_ISREG(attr.st_mode):
                      copy_file(remote_path, rel_path, attr)

          for attr in sftp.listdir_attr(remote_root):
              kind = "dir" if stat.S_ISDIR(attr.st_mode) else "file"
              top_level.append({"name": attr.filename, "kind": kind, "size": attr.st_size})
              if kind == "dir" and attr.filename in allowed_dirs:
                  walk(remote_root + "/" + attr.filename, Path(attr.filename))
              elif kind == "file" and attr.filename in allowed_root_files:
                  copy_file(remote_root + "/" + attr.filename, Path(attr.filename), attr)

          sftp.close()
          client.close()

          (target / "SERVER_TOPLEVEL.json").write_text(
              json.dumps(sorted(top_level, key=lambda x: x["name"]), ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (target / "SERVER_SNAPSHOT_MANIFEST.json").write_text(
              json.dumps(
                  {
                      "source_path": remote_root,
                      "captured_at_utc": datetime.now(timezone.utc).isoformat(),
                      "allowed_dirs": sorted(allowed_dirs),
                      "allowed_root_files": sorted(allowed_root_files),
                      "max_file_size": max_file_size,
                      "files": sorted(manifest, key=lambda x: x["path"]),
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"Downloaded {len(manifest)} source files from production")
          PY

      - name: Commit snapshot to backup branch
        shell: bash
        run: |
          git config user.name "flight-bot-backup"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B backup/server-live-src-2026-10-02
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/flight_bot_live/. .
          cat > SERVER_BACKUP.md <<'EOF'
          # Production server source snapshot

          Snapshot of the live application source from /opt/flight_bot on 2026-10-02.

          Sensitive/runtime material is intentionally excluded: .env files, private keys/certificates,
          databases, logs, virtual environments and caches.
          EOF
          git add -A
          git commit -m "backup: snapshot live flight bot source before channel automation"
          git push origin backup/server-live-src-2026-10-02 --force
