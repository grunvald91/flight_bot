name: Snapshot live flight bot

on:
  push:
    branches:
      - ops/server-snapshot-20261002

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 188.120.254.223
      SSH_USER: root
      SSH_PASSWORD: ${{ secrets.FLIGHT_BOT_SSH_PASSWORD }}
      REMOTE_PATH: /opt/flight_bot
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SSH secret
        run: |
          if [ -z "$SSH_PASSWORD" ]; then
            echo "FLIGHT_BOT_SSH_PASSWORD secret is not configured"
            exit 2
          fi

      - name: Prepare SSH client
        run: python -m pip install --disable-pip-version-check -q paramiko

      - name: Download safe source snapshot from production
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          import hashlib
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          import paramiko

          host = os.environ["SSH_HOST"]
          user = os.environ["SSH_USER"]
          password = os.environ["SSH_PASSWORD"]
          remote_root = os.environ["REMOTE_PATH"]

          target = Path("/tmp/flight_bot_live")
          target.mkdir(parents=True, exist_ok=True)

          excluded_dirs = {
              ".git", ".venv", "venv", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", "node_modules"
          }
          excluded_names = {
              ".env", ".env.local", ".env.production", "authorized_keys",
              "id_rsa", "id_ed25519"
          }
          excluded_suffixes = {
              ".db", ".sqlite", ".sqlite3", ".log", ".pem", ".key",
              ".crt", ".p12", ".pfx"
          }

          manifest = []

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(hostname=host, username=user, password=password, timeout=30)
          sftp = client.open_sftp()

          def safe_file(name):
              if name in excluded_names:
                  return False
              lower = name.lower()
              return not any(lower.endswith(sfx) for sfx in excluded_suffixes)

          def walk(remote_dir, rel=Path(".")):
              local_dir = target / rel
              local_dir.mkdir(parents=True, exist_ok=True)
              for attr in sftp.listdir_attr(remote_dir):
                  name = attr.filename
                  if name in (".", ".."):
                      continue
                  remote_path = remote_dir.rstrip("/") + "/" + name
                  rel_path = rel / name

                  if stat.S_ISDIR(attr.st_mode):
                      if name in excluded_dirs:
                          continue
                      walk(remote_path, rel_path)
                  elif stat.S_ISREG(attr.st_mode):
                      if not safe_file(name):
                          continue
                      local_path = target / rel_path
                      local_path.parent.mkdir(parents=True, exist_ok=True)
                      sftp.get(remote_path, str(local_path))
                      data = local_path.read_bytes()
                      manifest.append({
                          "path": str(rel_path),
                          "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "mtime_utc": datetime.fromtimestamp(
                              attr.st_mtime, tz=timezone.utc
                          ).isoformat(),
                      })

          walk(remote_root)
          sftp.close()
          client.close()

          (target / "SERVER_SNAPSHOT_MANIFEST.json").write_text(
              json.dumps(
                  {
                      "source_path": remote_root,
                      "captured_at_utc": datetime.now(timezone.utc).isoformat(),
                      "excluded": {
                          "dirs": sorted(excluded_dirs),
                          "names": sorted(excluded_names),
                          "suffixes": sorted(excluded_suffixes),
                      },
                      "files": sorted(manifest, key=lambda x: x["path"]),
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"Downloaded {len(manifest)} safe files from production")
          PY

      - name: Commit snapshot to backup branch
        shell: bash
        run: |
          git config user.name "flight-bot-backup"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B backup/server-live-2026-10-02
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/flight_bot_live/. .
          cat > SERVER_BACKUP.md <<'EOF'
          # Production server snapshot

          Snapshot of the live source tree from /opt/flight_bot captured on 2026-10-02.

          Sensitive/runtime material is intentionally excluded: .env files, private keys/certificates,
          database files, logs, virtual environments, caches, and Git metadata.

          This branch is a safety backup before reconciling production with main.
          EOF
          git add -A
          git commit -m "backup: snapshot live flight bot before channel automation"
          git push origin backup/server-live-2026-10-02 --force
