name: Validate flight bot feature

on:
  push:
    branches:
      - feature/daily-cheap-channels

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Compile
        run: python -m compileall -q bot database tests
      - name: Tests
        env:
          DB_TYPE: sqlite
          DB_NAME: test_flight_bot
        run: pytest -q
