name: Validate flight bot features

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-feature.yml"
      - "bot/handlers/travel.py"
      - "bot/services/tutu_mcp.py"
      - "bot/states/search.py"
      - "bot/keyboards/common_kb.py"
      - "bot/handlers/common.py"
      - "bot/main.py"
      - "tests/test_travel_planner.py"
      - "tests/test_channel_publisher.py"
      - "bot/handlers/entry.py"
      - "bot/services/entry_rules.py"
      - "bot/services/fast_browse.py"
      - "bot/handlers/browse.py"
      - "bot/handlers/discover.py"
      - "tests/test_entry_rules.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio aiosqlite greenlet
      - name: Compile
        run: python -m compileall -q bot database tests
      - name: Feature tests
        env:
          DB_TYPE: sqlite
          DB_NAME: test_flight_bot
          PYTHONPATH: .
        run: pytest -q tests/test_channel_publisher.py tests/test_travel_planner.py tests/test_entry_rules.py
