name: Validate flight bot features

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-feature.yml"
      - "bot/handlers/travel.py"
      - "bot/services/tutu_mcp.py"
      - "bot/states/search.py"
      - "bot/keyboards/common_kb.py"
      - "bot/handlers/common.py"
      - "bot/main.py"
      - "bot/handlers/month.py"
      - "bot/services/aviasales_api.py"
      - "tests/test_aviasales_api.py"
      - "tests/test_month_search.py"
      - "tests/test_travel_planner.py"
      - "tests/test_channel_publisher.py"
      - "bot/handlers/entry.py"
      - "bot/services/entry_rules.py"
      - "bot/services/fast_browse.py"
      - "bot/handlers/browse.py"
      - "bot/handlers/discover.py"
      - "bot/services/discovery_archive.py"
      - "bot/widgets/**"
      - "tests/test_widget_browse.py"
      - "tests/test_widget_ui.js"
      - "tests/test_widget_offers.py"
      - "tests/test_widget_offers_ui.js"
      - "tests/test_widget_month.py"
      - "tests/test_widget_month_ui.js"
      - "tests/test_entry_rules.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio aiosqlite greenlet
      - name: Compile
        run: python -m compileall -q bot database tests
      - name: Feature tests
        env:
          DB_TYPE: sqlite
          DB_NAME: test_flight_bot
          PYTHONPATH: .
        run: pytest -q tests/test_channel_publisher.py tests/test_travel_planner.py tests/test_entry_rules.py tests/test_aviasales_api.py tests/test_month_search.py tests/test_widget_browse.py tests/test_widget_offers.py tests/test_widget_month.py

      - name: HTML bubble UI smoke test
        run: |
          node tests/test_widget_ui.js
          node tests/test_widget_offers_ui.js
          node tests/test_widget_month_ui.js
