<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font:14px system-ui; color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#233)}
header,.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}h3{font-size:17px;margin:0}small{opacity:.7}button{border:1px solid var(--tg-theme-hint-color,#99a);border-radius:12px;padding:10px;background:transparent;color:inherit;font:inherit}button:disabled{opacity:.3}.active,.primary{background:var(--tg-theme-button-color,#3679dc);color:var(--tg-theme-button-text-color,white);border:0}
.item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;margin-top:8px;padding:12px;border-radius:13px}.city{font-weight:700}.secondary{font-size:11px;opacity:.68;margin-top:3px}.price{white-space:nowrap;text-align:right;font-weight:700}.nav{margin-top:12px}.nav button{flex:1}
#note{font-size:11px;opacity:.75;line-height:1.45;border-top:1px solid #9995;margin-top:12px;padding-top:9px}#detail{padding:15px;border:1px solid #9995;border-radius:14px;margin-top:10px}#detail h3{font-size:19px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}#detail p{white-space:pre-line;line-height:1.5} .hide{display:none!important}
</style></head><body><header><h3 id="title">⚡ Направления</h3><button id="direct">Без пересадок</button></header><small id="sub">Ориентировочные цены</small><section id="list"></section><section id="detail" class="hide"></section><div class="nav" id="nav"><button id="prev">◀</button><small id="count"></small><button id="next">▶</button></div><div id="note">≈ Цены ориентировочные. Наличие и итоговую стоимость нужно проверить у продавца.</div>
<script>(function(){"use strict";const W=window.TelegramWidget||{},E=id=>document.getElementById(id),txt=(e,v)=>{e.textContent=String(v==null?"":v)},mk=(label,css,fn)=>{const b=document.createElement("button");txt(b,label);if(css)b.className=css;b.addEventListener("click",fn);return b};let state={},scope={},busy=false;try{state=JSON.parse(W.publicData||"{}");scope=JSON.parse(W.chatData||"{}")}catch(e){}const key=/^[\w-]{1,64}$/.test(scope.k||"")?scope.k:null;const rub=p=>Number(p).toLocaleString("ru-RU")+" ₽";
async function ask(s){if(!key||busy||typeof W.request!=="function"){txt(E("note"),"Интерактивность недоступна в пересланной копии. Откройте бот.");return null}busy=true;try{const r=await W.request(s);return JSON.parse(r.result||"{}")}catch(e){txt(E("note"),"Не удалось загрузить данные. Повторите попытку.");return null}finally{busy=false}}
function listing(){E("list").classList.remove("hide");E("nav").classList.remove("hide");E("detail").classList.add("hide");txt(E("title"),"⚡ "+(state.title||"Направления"));txt(E("sub"),"≈ Цены на "+(state.date||"выбранную дату")+" · "+(state.total||0)+" направлений"+(state.incomplete?" · прямые рейсы найдены не все":""));txt(E("direct"),state.d?"✓ Прямые":"Без пересадок");E("direct").className=state.d?"active":"";E("list").replaceChildren();(state.rows||[]).forEach(r=>{const b=mk("","item",()=>details(r)),a=document.createElement("div"),c=document.createElement("div"),n=document.createElement("div"),p=document.createElement("div"),t=document.createElement("div");c.className="city";n.className="secondary";p.className="price";t.className="secondary";txt(c,r.c);txt(n,r.n);txt(p,"≈"+rub(r.p));txt(t,r.t===0?"Прямой":r.t==null?"Пересадки неизвестны":r.t+" пересад.");a.append(c,n);p.append(t);b.append(a,p);E("list").append(b)});if(!(state.rows||[]).length)txt(E("list"),"Подходящих направлений нет");txt(E("count"),(state.p+1)+"/"+state.pages);E("prev").disabled=state.p<=0;E("next").disabled=state.p+1>=state.pages}
function details(r){E("list").classList.add("hide");E("nav").classList.add("hide");E("detail").classList.remove("hide");E("detail").replaceChildren();const h=document.createElement("h3"),p=document.createElement("p"),a=document.createElement("div");a.className="actions";txt(h,r.c);txt(p,r.n+"\n≈"+rub(r.p)+" · "+(r.t===0?"Прямой рейс":r.t==null?"Пересадки неизвестны":r.t+" пересад."));a.append(mk("🔎 Проверить рейс","primary",async()=>{const d=await ask("c:"+key+":"+r.i+":"+(state.d?1:0));if(d)txt(E("note"),d.message||d.error||"Не удалось начать проверку")}),mk("ℹ️ Виза","",async()=>{const v=await ask("v:"+key+":"+r.i);if(!v)return;E("detail").replaceChildren();const title=document.createElement("h3"),body=document.createElement("p"),actions=document.createElement("div");actions.className="actions";txt(title,v.name||r.n);txt(body,v.summary||v.error||"Нет данных");if(v.url&&typeof W.openLink==="function")actions.append(mk("Источник правил","primary",()=>W.openLink(v.url)));actions.append(mk("← К рейсу","",()=>details(r)));E("detail").append(title,body,actions)}),mk("← Назад","",listing));E("detail").append(h,p,a)}
async function page(p,d){const a=await ask("b:"+key+":"+p+":"+d);if(a&&a.ok){state=a;listing()}else if(a)txt(E("note"),a.error||"Недоступно")}
E("prev").onclick=()=>page(state.p-1,state.d?1:0);E("next").onclick=()=>page(state.p+1,state.d?1:0);E("direct").onclick=()=>page(0,state.d?0:1);listing();if(typeof W.ready==="function")W.ready()})();</script></body></html>
