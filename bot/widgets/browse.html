<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font:13px system-ui;color-scheme:light dark;--p:var(--tg-theme-secondary-bg-color,#f3f6ff);--a:var(--tg-theme-link-color,#5755ce)}*{box-sizing:border-box}body{margin:0;padding:10px;color:var(--tg-theme-text-color,#172345);background:var(--tg-theme-bg-color,#fff)}button{font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.4}.hero{background:radial-gradient(circle at 94% 5%,#6685e3,transparent 45%),linear-gradient(120deg,#132650,#34317e 75%,#5a54b6);color:#fff;padding:16px 14px;border-radius:19px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:16px;top:22px;font-size:33px;color:#a3eaf7;animation:float 6s ease-in-out infinite alternate;pointer-events:none}.eyebrow{color:#b6f8f2;font-size:10px;letter-spacing:.8px;font-weight:850;margin-bottom:7px}header,.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}h3{font-size:20px;font-weight:900;margin:0;line-height:1.2;max-width:63%}small{color:var(--tg-theme-hint-color,#8189a0);font-size:11px;line-height:1.4}.hero small{display:block;color:#c5daff;margin-top:7px}button{border:1px solid var(--tg-theme-section-separator-color,#dce3f3);border-radius:11px;padding:10px;background:var(--p);font-weight:800;min-height:38px;transition:transform .15s}#direct{border:1px solid #a7ceff77;background:#fff1;color:#fff;font-size:10px;max-width:37%;padding:8px}#direct.active{background:#d8f8ec;color:#193a58;border-color:#d8f8ec}#list{margin-top:9px}.item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;margin-top:7px;padding:12px 10px;border-radius:14px;background:var(--p);border:1px solid var(--tg-theme-section-separator-color,#dce3f3);border-left:3px solid #7b79db;min-height:66px;animation:rise .34s ease-out both;transition:transform .15s}.item:nth-child(2){animation-delay:.06s}.item:nth-child(3){animation-delay:.12s}.city{font-weight:900;font-size:15px;line-height:1.2}.secondary{font-size:11px;color:var(--tg-theme-hint-color,#8189a0);margin-top:5px}.price{white-space:nowrap;text-align:right;font-size:17px;font-weight:900;color:var(--a)}.nav{margin-top:11px}.nav button{flex:1}#note{font-size:10px;color:var(--tg-theme-hint-color,#8189a0);line-height:1.45;border-top:1px solid var(--tg-theme-section-separator-color,#dce3f3);margin-top:11px;padding:8px 2px}#detail{padding:15px;background:var(--p);border-radius:17px;margin-top:11px;animation:rise .3s ease-out both}#detail h3{font-size:21px;max-width:none}#detail p{white-space:pre-line;line-height:1.6;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;background:var(--tg-theme-bg-color,#fff)}.actions .primary{background:#5654ca;color:white;border-color:#5654ca}.hide{display:none!important}button:active,.item:active{transform:scale(.975)}@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}@keyframes float{from{transform:translate(-3px,3px)}to{transform:translate(3px,-3px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="hero"><div class="eyebrow">✈ FLIGHT • НОВЫЕ НАПРАВЛЕНИЯ</div><header><h3 id="title">⚡ Направления</h3><button id="direct">Без пересадок</button></header><small id="sub">Ориентировочные цены</small></div><section id="list"></section><section id="detail" class="hide"></section><div class="nav" id="nav"><button id="prev">◀</button><small id="count"></small><button id="next">▶</button></div><div id="note">≈ Цены ориентировочные. Наличие и итоговую стоимость нужно проверить у продавца.</div>
<script>(function(){"use strict";const W=window.TelegramWidget||{},E=id=>document.getElementById(id),txt=(e,v)=>{e.textContent=String(v==null?"":v)},mk=(label,css,fn)=>{const b=document.createElement("button");txt(b,label);if(css)b.className=css;b.addEventListener("click",fn);return b};let state={},scope={},busy=false;try{state=JSON.parse(W.publicData||"{}");scope=JSON.parse(W.chatData||"{}")}catch(e){}const key=/^[\w-]{1,64}$/.test(scope.k||"")?scope.k:null;const rub=p=>Number(p).toLocaleString("ru-RU")+" ₽";

function listing(){E("list").classList.remove("hide");E("nav").classList.remove("hide");E("detail").classList.add("hide");txt(E("title"),"⚡ "+(state.title||"Направления"));txt(E("sub"),"≈ Цены на "+(state.date||"выбранную дату")+" · "+(state.total||0)+" направлений"+(state.incomplete?" · прямые рейсы найдены не все":""));txt(E("direct"),state.d?"✓ Прямые":"Без пересадок");E("direct").className=state.d?"active":"";E("list").textContent="";(state.rows||[]).forEach(r=>{const b=mk("","item",()=>details(r)),a=document.createElement("div"),c=document.createElement("div"),n=document.createElement("div"),p=document.createElement("div"),t=document.createElement("div");c.className="city";n.className="secondary";p.className="price";t.className="secondary";txt(c,r.c);txt(n,r.n);txt(p,"≈"+rub(r.p));txt(t,(r.t===0?"Прямой":r.t==null?"Пересадки неизвестны":r.t+" пересад.")+(r.a?" · "+r.a:""));a.appendChild(c);a.appendChild(n);p.appendChild(t);b.appendChild(a);b.appendChild(p);E("list").appendChild(b)});if(!(state.rows||[]).length)txt(E("list"),"Подходящих направлений нет");txt(E("count"),(state.p+1)+"/"+state.pages);E("prev").disabled=state.p<=0;E("next").disabled=state.p+1>=state.pages}
function details(r){E("list").classList.add("hide");E("nav").classList.add("hide");E("detail").classList.remove("hide");E("detail").textContent="";const h=document.createElement("h3"),p=document.createElement("p"),a=document.createElement("div");a.className="actions";txt(h,r.c);txt(p,r.n+"\n≈"+rub(r.p)+" · "+(r.t===0?"Прямой рейс":r.t==null?"Пересадки неизвестны":r.t+" пересад.")+(r.at?"\nВылет: "+r.at:"")+(r.a?"\nПеревозчик: "+r.a:""));a.appendChild(mk("🔎 Проверить рейс","primary",async()=>{const d=await ask("c:"+key+":"+r.i+":"+(state.d?1:0));if(d)txt(E("note"),d.message||d.error||"Не удалось начать проверку")}));a.appendChild(mk("ℹ️ Виза","",async()=>{const v=await ask("v:"+key+":"+r.i);if(!v)return;E("detail").textContent="";const title=document.createElement("h3"),body=document.createElement("p"),actions=document.createElement("div");actions.className="actions";txt(title,v.name||r.n);txt(body,v.summary||v.error||"Нет данных");if(v.url&&typeof W.openLink==="function")actions.appendChild(mk("Источник правил","primary",()=>W.openLink(v.url)));actions.appendChild(mk("← К рейсу","",()=>details(r)));E("detail").appendChild(title);E("detail").appendChild(body);E("detail").appendChild(actions)}));a.appendChild(mk("← Назад","",listing));E("detail").appendChild(h);E("detail").appendChild(p);E("detail").appendChild(a)}
async function page(p,d,save){const a=await ask((save?"t:":"b:")+key+":"+p+":"+d);if(a&&a.ok){state=a;listing();if(a.preference_saved===false)txt(E("note"),"Фильтр применён, но настройка не сохранилась.")}else if(a)txt(E("note"),a.error||"Недоступно")}
E("prev").addEventListener("click",()=>page(state.p-1,state.d?1:0));E("next").addEventListener("click",()=>page(state.p+1,state.d?1:0));E("direct").addEventListener("click",()=>page(0,state.d?0:1,true));listing();if(typeof W.ready==="function")W.ready()})();</script></body></html>
