<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
:root{font:13px system-ui,sans-serif;color-scheme:light dark;--ink:var(--tg-theme-text-color,#17233a);--card:var(--tg-theme-secondary-bg-color,#f1f5ff);--blue:#5654dd}
*{box-sizing:border-box}body{margin:0;padding:10px;color:var(--ink);background:var(--tg-theme-bg-color,#fff)}
button{font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.3}
.hide{display:none!important}
.hero{border-radius:20px;padding:15px 15px 13px;color:white;background:radial-gradient(circle at 92% 5%,#637de9 0%,transparent 48%),linear-gradient(125deg,#152752,#32317d 68%,#5258b4);position:relative;overflow:hidden}
.hero:after{content:"✦";position:absolute;right:16px;top:21px;font-size:31px;opacity:.25}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.1px;color:#b8e9ff}
h1{font-size:19px;line-height:1.25;font-weight:800;letter-spacing:-.4px;margin:7px 0 5px;max-width:94%}
.sub{font-size:11px;opacity:.8}
.best{margin-top:9px;border-radius:15px;padding:11px 13px;background:linear-gradient(110deg,#e7f7ff,#e8e8ff);color:#1b295b;display:flex;align-items:center;justify-content:space-between;gap:7px}
.best b{font-size:23px;font-weight:900;letter-spacing:-.7px}.best small{font-size:10px;opacity:.68;display:block;margin-bottom:2px}
.best .date{font-size:11px;font-weight:700;text-align:right}
.tabs{display:flex;gap:7px;margin-top:10px}
.chip{border:1px solid var(--tg-theme-section-separator-color,#d9deee);background:var(--card);border-radius:11px;padding:9px 8px;min-width:0;font-size:11px;font-weight:700;flex:1}
.chip.on{border-color:transparent;background:#4a56c7;color:#fff}
.title{font-size:10px;font-weight:800;opacity:.65;letter-spacing:.5px;margin:12px 2px 5px}
.flight{display:flex;width:100%;background:var(--card);border:0;border-radius:13px;padding:10px 11px;gap:10px;margin-top:6px;align-items:center;text-align:left}
.index{background:linear-gradient(135deg,#c9e8ff,#dad5ff);color:#303875;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}
.body{flex:1;min-width:0}.body strong{display:block;font-size:12px}.body small{font-size:10px;opacity:.65;display:block;margin-top:2px}
.price{font-size:15px;font-weight:900;color:var(--tg-theme-link-color,#4161ce);white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:11px}
.nav button{flex:1}.nav span{font-size:11px;min-width:33px;text-align:center}
.foot{font-size:10px;opacity:.65;line-height:1.45;margin-top:10px;padding-top:7px;border-top:1px solid var(--tg-theme-section-separator-color,#ddd)}
.panel{background:var(--card);border-radius:18px;padding:15px;margin-top:9px}
.panel h2{margin:5px 0;font-size:18px;line-height:1.25}
.huge{font-weight:900;font-size:26px;color:var(--tg-theme-link-color,#4161ce);margin:10px 0}
.field{display:flex;justify-content:space-between;padding:8px 0;gap:10px;border-bottom:1px solid var(--tg-theme-section-separator-color,#dde3ee)}
.field span:first-child{font-size:11px;opacity:.65}.field span:last-child{font-size:12px;text-align:right;font-weight:700}
.actions{display:flex;gap:8px;margin-top:14px}
.primary{background:#5154d3;color:#fff;border:0;border-radius:12px;padding:11px;flex:1;font-weight:700}
.ghost{border:1px solid #8d94c44d;background:var(--card);border-radius:12px;padding:11px;flex:1}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:9px}
.day{padding:5px 0;min-height:44px;background:var(--card);border:0;border-radius:9px;text-align:center}
.day b{display:block;font-size:11px}.day small{display:block;font-size:9px;margin-top:3px;color:var(--tg-theme-link-color,#5154d3)}
.day.none{opacity:.28}.day.cheapest{background:#d8f3e9;color:#164b45}
#note{font-size:11px;line-height:1.4;margin-top:8px;opacity:.72}
</style></head><body>
<div class="hero"><div class="eyebrow">✈️ FLIGHT • ВЫГОДНЫЕ ДАТЫ</div><h1 id="route">Самые дешёвые билеты</h1><div class="sub" id="window">Ближайшие 30 дней • Aviasales</div></div>
<div id="listview"><div class="best"><div><small>Самый дешёвый в выбранном фильтре</small><b id="minprice">—</b></div><div class="date" id="mindate">Данные загружаются</div></div>
<div class="tabs"><button id="all" class="chip on">Все</button><button id="direct" class="chip">✈ Прямые</button><button id="calendar" class="chip">▦ Календарь</button></div>
<div class="tabs"><button id="price" class="chip on">↓ Цена</button><button id="date" class="chip">По дате</button></div>
<div class="title" id="heading">Выгодные предложения</div><div id="items"></div>
<div class="nav"><button id="prev" class="chip">←</button><span id="page">1/1</span><button id="next" class="chip">→</button></div>
</div>
<div id="calview" class="hide"><div class="title">МИНИМАЛЬНЫЕ ЦЕНЫ ПО ДНЯМ</div><div id="cal" class="grid"></div><div class="actions"><button id="calback" class="ghost">← К предложениям</button></div></div>
<div id="detail" class="hide"></div>
<div id="note" class="foot">≈ Цены ориентировочные, из Aviasales. Наличие, маршрут и итог проверяйте перед оплатой.</div>
<script>(function(){"use strict";
const W=window.TelegramWidget||{},G=id=>document.getElementById(id),T=(el,v)=>el.textContent=String(v==null?"":v),
E=(tag,cls,value)=>{const n=document.createElement(tag);n.className=cls||"";T(n,value);return n};
let s={},scope={},busy=false;
try{s=JSON.parse(W.publicData||"{}");scope=JSON.parse(W.chatData||"{}")}catch(e){}
const key=/^[\w-]{1,64}$/.test(scope.k||"")?scope.k:null,money=v=>Number(v).toLocaleString("ru-RU")+" ₽";
const label=dt=>{if(!dt)return "—";const a=String(dt).slice(0,10).split("-");return a.length===3?a[2]+"."+a[1]:"—"};
const transfers=t=>t===0?"Прямой":t==null?"Пересадки неизвестны":t+" пересад.";
function note(v){T(G("note"),v)}
async function ask(q){
 if(!key||busy||typeof W.request!=="function"){note("Действие недоступно. Откройте карточку в боте.");return null}
 busy=true;try{const r=await W.request(q);return JSON.parse(r.result||"{}")}
 catch(e){note("Не удалось получить данные. Повторите попытку.");return null}
 finally{busy=false}
}
function show(id){["listview","calview","detail"].forEach(n=>G(n).className=n===id?"":"hide")}
function render(){
 show("listview");T(G("route"),s.route||"Дешёвые билеты");T(G("window"),"Следующие 30 дней • цены Aviasales");
 T(G("minprice"),s.best?money(s.best.p):"Не найдено");T(G("mindate"),s.best?label(s.best.dt):"Попробуйте все рейсы");
 G("all").className="chip"+(s.d?"":" on");G("direct").className="chip"+(s.d?" on":"");
 G("price").className="chip"+(s.s==="p"?" on":"");G("date").className="chip"+(s.s==="d"?" on":"");
 T(G("heading"),s.day<0?"Варианты по направлению • "+s.total:"На дату "+label(new Date(Date.parse(s.start+"T00:00:00Z")+s.day*86400000).toISOString())+" • "+s.total);
 G("items").textContent="";
 (s.rows||[]).forEach((r,j)=>{
  const b=E("button","flight",""),num=E("span","index",String(s.pg*4+j+1).padStart(2,"0")),
   body=E("span","body",""),name=E("strong","",label(r.dt)+(r.tm?" • "+r.tm:"")),
   tag=E("small","",transfers(r.t)+(r.c?" · "+r.c:"")),price=E("span","price",money(r.p));
  body.appendChild(name);body.appendChild(tag);b.appendChild(num);b.appendChild(body);b.appendChild(price);
  b.addEventListener("click",()=>details(r.i));G("items").appendChild(b);
 });
 if(!(s.rows||[]).length)G("items").appendChild(E("div","panel","На выбранные даты предложений нет. Снимите фильтр."));
 T(G("page"),(s.pg+1)+"/"+s.pages);G("prev").disabled=s.pg<=0;G("next").disabled=s.pg+1>=s.pages
}
async function load(page,d,sort,day){
 const r=await ask("ml:"+key+":"+page+":"+(d?1:0)+":"+sort+":"+day);
 if(r&&r.ok){s=r;render()}else if(r)note(r.error||"Не удалось обновить билеты")
}
function field(el,k,v){const line=E("div","field","");line.appendChild(E("span","",k));line.appendChild(E("span","",v));el.appendChild(line)}
async function details(i){
 const r=await ask("md:"+key+":"+i);if(!r)return;if(!r.ok){note(r.error);return}
 show("detail");const p=G("detail");p.textContent="";
 const box=E("div","panel","");box.appendChild(E("div","eyebrow","✈ ВЫБРАННАЯ ДАТА"));
 box.appendChild(E("h2","",r.route));box.appendChild(E("div","huge",money(r.p)));
 field(box,"Вылет",String(r.dt||"—").replace("T"," ").slice(0,16));
 field(box,"Пересадки",transfers(r.t));
 field(box,"Перевозчик",r.c||"Не указан");
 if(r.duration!=null)field(box,"В пути",Math.floor(r.duration/60)+" ч "+r.duration%60+" мин");
 field(box,"Источник","Aviasales • цена ориентировочная");
 const a=E("div","actions","");
 if(r.can_open){const b=E("button","primary","Проверить цену ↗");b.addEventListener("click",async()=>{const x=await ask("ma:"+key+":"+i);if(x)note(x.message||x.error||"Ошибка")});a.appendChild(b)}
 const back=E("button","ghost","← Назад");back.addEventListener("click",render);a.appendChild(back);
 box.appendChild(a);p.appendChild(box)
}
async function calendar(){
 const r=await ask("mc:"+key+":"+(s.d?1:0));if(!r)return;if(!r.ok){note(r.error);return}
 show("calview");const root=G("cal");root.textContent="";
 const by={};(r.rows||[]).forEach(x=>by[x.i]=x.p);
 const best=Math.min(...(r.rows||[]).map(x=>x.p));
 for(let i=0;i<r.n;i++){
  const dt=new Date(Date.parse(r.start+"T00:00:00Z")+i*86400000);
  const v=by[i],b=E("button","day"+(v===undefined?" none":v===best?" cheapest":""),"");
  b.appendChild(E("b","",dt.getUTCDate()));b.appendChild(E("small","",v===undefined?"—":Math.round(v/100)/10+"к"));
  b.disabled=v===undefined;b.addEventListener("click",()=>load(0,s.d,s.s,i));root.appendChild(b)
 }
}
G("prev").addEventListener("click",()=>load(s.pg-1,s.d,s.s,s.day));
G("next").addEventListener("click",()=>load(s.pg+1,s.d,s.s,s.day));
G("all").addEventListener("click",()=>load(0,0,s.s,-1));
G("direct").addEventListener("click",()=>load(0,1,s.s,-1));
G("price").addEventListener("click",()=>load(0,s.d,"p",s.day));
G("date").addEventListener("click",()=>load(0,s.d,"d",s.day));
G("calendar").addEventListener("click",calendar);
G("calback").addEventListener("click",render);
render();if(typeof W.ready==="function")W.ready();
})();</script></body></html>
