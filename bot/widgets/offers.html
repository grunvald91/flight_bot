<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font:14px system-ui;color-scheme:light dark;--p:var(--tg-theme-secondary-bg-color,#f2f5ff);--a:var(--tg-theme-link-color,#5354cf)}*{box-sizing:border-box}body{margin:0;padding:10px;color:var(--tg-theme-text-color,#182340);background:var(--tg-theme-bg-color,#fff)}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.3}header{background:radial-gradient(circle at 95% 5%,#637fe6 0%,transparent 45%),linear-gradient(123deg,#152752,#353080 74%,#5958c2);color:white;border-radius:19px;padding:15px 14px;position:relative}header:after{content:"✦";position:absolute;right:18px;top:29px;font-size:34px;opacity:.18}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:10px;font-weight:800;color:#bcf4f1}.meta{font-size:10px;opacity:.8}h1{font-size:21px;line-height:1.13;margin:8px 0;font-weight:900;max-width:89%}.lead{font-size:11px;opacity:.84;line-height:1.4;max-width:90%}.filters{display:flex;gap:7px;margin-top:8px}.filters button{flex:1}.chip{border:0;border-radius:12px;background:var(--p);padding:9px 6px;font-size:11px;}.chip.on{background:#5155d1;color:#fff}.cap{font-size:10px;font-weight:800;opacity:.63;margin:13px 3px 6px}.flight{display:block;width:100%;border:0;border-left:3px solid #7880dd;background:var(--p);border-radius:15px;text-align:left;padding:11px;margin-top:7px;}.head{display:flex;align-items:center;justify-content:space-between;gap:6px}.route{font-size:14px;font-weight:850;overflow:hidden;text-overflow:ellipsis;}.price{font-size:17px;font-weight:900;color:var(--a)}.secondary{font-size:11px;line-height:1.5;margin-top:5px}.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.tag{font-size:10px;background:var(--tg-theme-bg-color,#fff);border-radius:7px;padding:4px 6px;opacity:.85}.nav{display:flex;align-items:center;gap:8px;margin-top:10px}.nav button{flex:1}.nav span{font-size:11px;opacity:.7}.foot{font-size:10px;line-height:1.45;opacity:.7;margin:10px 1px}.hide{display:none!important}.panel{border-radius:18px;padding:16px;background:var(--p);}.panel h2{font-size:19px;line-height:1.2;margin:7px 0}.bigprice{font-size:27px;font-weight:900;color:var(--a);margin:12px 0}.field{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:8px 0;}.field span:first-child{opacity:.65}.field span:last-child{text-align:right;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.primary{background:#5154d3;border:0;color:white;border-radius:12px;padding:11px;font-weight:800;flex:1}.ghost{background:var(--tg-theme-bg-color,#fff);border:0;border-radius:12px;padding:11px;flex:1}#note{margin-top:9px;font-size:10px;line-height:1.4;color:var(--tg-theme-hint-color,#8088a1)}.flight,.panel{animation:rise .34s ease-out both}.flight:nth-child(2){animation-delay:.07s}.chip:active,.flight:active,.primary:active,.ghost:active{transform:scale(.975)}@keyframes rise{from{transform:translateY(9px)}to{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.flight,.panel{animation:none}}</style></head><body><div id="catalog"><header><div class="top"><span id="brand" class="brand">✈ FLIGHT / БИЛЕТЫ</span><span id="meta" class="meta"></span></div><h1 id="heading">Авиабилеты</h1><div id="lead" class="lead"></div></header><div class="filters"><button id="all" class="chip on">Все рейсы</button><button id="direct" class="chip">✈ Без пересадок</button></div><div class="filters"><button id="price" class="chip on">↓ По цене</button><button id="stops" class="chip">По пересадкам</button></div><div id="cap" class="cap">Найденные предложения</div><div id="list" class="list"></div><div class="nav"><button id="prev" class="chip">← Назад</button><span id="page"></span><button id="next" class="chip">Далее →</button></div></div><div id="detail" class="panel hide"></div><div id="note" class="foot">Стоимость и наличие зависят от продавца. Перед оплатой проверьте маршрут и условия тарифа.</div><script>(function(){"use strict";const W=window.TelegramWidget||{},G=id=>document.getElementById(id),set=(e,v)=>{e.textContent=String(v==null?"":v)};const mk=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls||"";set(e,text);return e};let state={},scope={},busy=false;try{state=JSON.parse(W.publicData||"{}");scope=JSON.parse(W.chatData||"{}")}catch(e){}const key=/^[A-Za-z0-9_-]{1,64}$/.test(scope.k||"")?scope.k:null;const money=n=>Number(n||0).toLocaleString("ru-RU")+" ₽";const stops=s=>s===0?"Без пересадок":s==null?"Пересадки не указаны":s===1?"1 пересадка":s+" пересадки";const time=v=>v?String(v).replace("T"," ").replace("Z","").slice(0,16):"Не указано";function note(v){set(G("note"),v)}async function ask(cmd){if(!key||busy||typeof W.request!=="function"){note("Интерактивность недоступна. Откройте исходную карточку в боте.");return null}busy=true;try{const res=await W.request(cmd);return JSON.parse(res.result||"{}")}catch(e){note("Не удалось связаться с ботом. Повторите действие.");return null}finally{busy=false}}function render(){G("catalog").classList.remove("hide");G("detail").classList.add("hide");const intl=state.m==="discover";set(G("brand"),intl?"🌍 МЕЖДУНАРОДНЫЙ ПОИСК":"✈ РЕЙСЫ • TUTU");set(G("heading"),intl?"Маршруты за границу":"Найденные авиабилеты");set(G("meta"),state.dt||"");set(G("lead"),(state.total||0)+" предложений • Туту"+(state.unverified?" • "+state.unverified+" маршрутов не проверено":""));G("all").className="chip"+(state.d?"":" on");G("direct").className="chip"+(state.d?" on":"");G("price").className="chip"+(state.s==="p"?" on":"");G("stops").className="chip"+(state.s==="s"?" on":"");set(G("cap"),state.d?"Рейсы без пересадок":"Нажмите на рейс для подробностей");G("list").textContent="";(state.rows||[]).forEach(r=>{const b=mk("button","flight",""),row=mk("div","head",""),title=mk("span","route",r.b||r.a||"Рейс"),price=mk("span","price",money(r.p));row.appendChild(title);row.appendChild(price);b.appendChild(row);const line=mk("div","secondary",(r.a&&r.b?r.a+" → "+r.b:"")+ (r.t?" • "+time(r.t):""));b.appendChild(line);const tags=mk("div","tags","");tags.appendChild(mk("span","tag",stops(r.s)));if(r.c)tags.appendChild(mk("span","tag",r.c));b.appendChild(tags);b.addEventListener("click",()=>detail(r));G("list").appendChild(b)});if(!(state.rows||[]).length)G("list").appendChild(mk("div","secondary","Подходящих рейсов нет — измените фильтр."));set(G("page"),(state.pg+1)+" / "+state.pages);G("prev").disabled=state.pg===0;G("next").disabled=state.pg>=state.pages-1}function field(parent,label,value){const e=mk("div","field","");e.appendChild(mk("span","",label));e.appendChild(mk("span","",value));parent.appendChild(e)}async function detail(r){const d=await ask("od:"+key+":"+r.i);if(!d)return;if(!d.ok){note(d.error||"Не удалось открыть билет");return}G("catalog").classList.add("hide");const panel=G("detail");panel.classList.remove("hide");panel.textContent="";panel.appendChild(mk("div","brand",state.m==="discover"?"🌍 МЕЖДУНАРОДНЫЙ РЕЙС":"🟣 ВЫБРАННЫЙ БИЛЕТ"));panel.appendChild(mk("h2","",d.a+" → "+d.b));panel.appendChild(mk("div","bigprice",money(d.p)));field(panel,"Вылет",time(d.depart));field(panel,"Прилёт",time(d.arrive));field(panel,"Пересадки",stops(d.s));if(d.airline)field(panel,"Перевозчик",d.airline);if(d.duration!=null)field(panel,"В пути",Math.floor(d.duration/60)+" ч "+(d.duration%60)+" мин");if(d.fare)field(panel,"Тариф",d.fare);if(d.bag!==null)field(panel,"Багаж",d.bag===0?"Без багажа":d.bag+" мест"+(d.bagkg!=null?", до "+d.bagkg+" кг":""));if(d.hand!==null)field(panel,"Ручная кладь",d.hand+" мест");if(d.refund!==null)field(panel,"Возврат",d.refund?"Возможен":"Не предусмотрен");if(d.change!==null)field(panel,"Изменение",d.change?"Возможно":"Не предусмотрено");const buttons=mk("div","actions","");if(d.checkout){const buy=mk("button","primary","🎟 Открыть оформление");buy.addEventListener("click",async()=>{const response=await ask("oa:"+key+":"+r.i);if(response)note(response.message||response.error||"Нет ответа")});buttons.appendChild(buy)}if(d.visa){const visa=mk("button","ghost","ℹ️ Виза");visa.addEventListener("click",()=>showVisa(r));buttons.appendChild(visa)}const back=mk("button","ghost","← К списку");back.addEventListener("click",render);buttons.appendChild(back);panel.appendChild(buttons)}async function showVisa(r){const d=await ask("ov:"+key+":"+r.i);if(!d)return;const panel=G("detail");panel.textContent="";panel.appendChild(mk("div","brand","ℹ️ ПРАВИЛА ВЪЕЗДА"));panel.appendChild(mk("h2","",d.name||r.b));panel.appendChild(mk("div","secondary",d.summary||d.error||"Нет данных"));const actions=mk("div","actions","");if(d.url&&typeof W.openLink==="function"){const link=mk("button","primary","Источник правил");link.addEventListener("click",()=>W.openLink(d.url));actions.appendChild(link)}const back=mk("button","ghost","← К билету");back.addEventListener("click",()=>detail(r));actions.appendChild(back);panel.appendChild(actions)}async function load(page,direct,sort){const result=await ask("of:"+key+":"+page+":"+(direct?1:0)+":"+sort);if(result&&result.ok){state=result;render()}else if(result)note(result.error||"Не удалось обновить рейсы")}G("prev").addEventListener("click",()=>load(state.pg-1,state.d,state.s));G("next").addEventListener("click",()=>load(state.pg+1,state.d,state.s));G("all").addEventListener("click",()=>load(0,0,state.s));G("direct").addEventListener("click",()=>load(0,1,state.s));G("price").addEventListener("click",()=>load(0,state.d,"p"));G("stops").addEventListener("click",()=>load(0,state.d,"s"));render();if(typeof W.ready==="function")W.ready()})();</script></body></html>
