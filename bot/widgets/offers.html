<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;padding:13px 12px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#1d2533)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--tg-theme-link-color,#4285e6);text-transform:uppercase}
.meta{opacity:.65;font-size:11px}
h1{font-size:20px;line-height:1.15;letter-spacing:-.045em;margin:5px 0 7px;font-weight:800}
.lead{display:flex;align-items:center;gap:7px;font-size:11px;opacity:.72;margin:2px 0 11px}
.chip{border:1px solid var(--tg-theme-section-separator-color,#ddd);border-radius:12px;background:transparent;color:inherit;padding:8px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--tg-theme-button-color,#327df5);color:var(--tg-theme-button-text-color,#fff);border-color:transparent}
.filters{display:flex;gap:6px;align-items:center;margin:7px 0 9px}
.filters button{flex:1}
.cap{font-size:10px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;opacity:.55;margin:12px 0 6px}
.list{min-height:170px}
.flight{display:block;width:100%;border:1px solid var(--tg-theme-section-separator-color,#e3e6eb);background:var(--tg-theme-secondary-bg-color,#f7f9fc);border-radius:16px;text-align:left;color:inherit;padding:12px;margin:7px 0}
.flight:active{transform:scale(.995)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.route{font-weight:800;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-size:17px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;color:var(--tg-theme-link-color,#267be5)}
.secondary{font-size:11px;opacity:.72;line-height:1.6;margin-top:5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;border:1px solid var(--tg-theme-section-separator-color,#dfe5ed);border-radius:7px;padding:3px 5px;opacity:.82}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
.nav button{flex:1;padding:8px}
.nav span{font-size:12px;opacity:.65;min-width:40px;text-align:center}
.foot{font-size:10px;line-height:1.5;opacity:.64;border-top:1px solid var(--tg-theme-section-separator-color,#e4e7ea);padding-top:9px;margin-top:10px}
.hide{display:none!important}
.panel{border-radius:16px;border:1px solid var(--tg-theme-section-separator-color,#e2e7ee);padding:13px 12px;background:var(--tg-theme-secondary-bg-color,#f7f9fc)}
.panel h2{font-size:19px;margin:5px 0 2px;letter-spacing:-.035em}
.bigprice{font-size:25px;font-weight:900;letter-spacing:-.05em;color:var(--tg-theme-link-color,#327df5);margin:7px 0}
.field{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--tg-theme-section-separator-color,#e0e4e9)}
.field span:first-child{opacity:.65;max-width:42%}.field span:last-child{text-align:right;font-weight:650;max-width:58%;overflow-wrap:anywhere}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.primary{background:var(--tg-theme-button-color,#327df5);border:0;color:var(--tg-theme-button-text-color,#fff);border-radius:12px;padding:11px 12px;font-weight:700;flex:1}
.ghost{background:transparent;color:inherit;border:1px solid var(--tg-theme-section-separator-color,#ddd);border-radius:12px;padding:10px 12px;flex:1}
#note{margin-top:8px;font-size:11px;line-height:1.4;color:var(--tg-theme-hint-color,#7d8490)}
</style></head>
<body>
<div id="catalog">
<header><div class="top"><span id="brand" class="brand">✈ FLIGHT / БИЛЕТЫ</span><span id="meta" class="meta"></span></div><h1 id="heading">Авиабилеты</h1><div id="lead" class="lead"></div></header>
<div class="filters"><button id="all" class="chip on">Все рейсы</button><button id="direct" class="chip">✈ Без пересадок</button></div>
<div class="filters"><button id="price" class="chip on">↓ По цене</button><button id="stops" class="chip">По пересадкам</button></div>
<div id="cap" class="cap">Найденные предложения</div>
<div id="list" class="list"></div>
<div class="nav"><button id="prev" class="chip">← Назад</button><span id="page"></span><button id="next" class="chip">Далее →</button></div>
</div>
<div id="detail" class="panel hide"></div>
<div id="note" class="foot">Стоимость и наличие зависят от продавца. Перед оплатой проверьте маршрут и условия тарифа.</div>
<script>(function(){"use strict";
const W=window.TelegramWidget||{},G=id=>document.getElementById(id),set=(e,v)=>{e.textContent=String(v==null?"":v)};
const mk=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls||"";set(e,text);return e};
let state={},scope={},busy=false;
try{state=JSON.parse(W.publicData||"{}");scope=JSON.parse(W.chatData||"{}")}catch(e){}
const key=/^[A-Za-z0-9_-]{1,64}$/.test(scope.k||"")?scope.k:null;
const money=n=>"≈"+Number(n||0).toLocaleString("ru-RU")+" ₽";
const stops=s=>s===0?"Без пересадок":s==null?"Пересадки не указаны":s===1?"1 пересадка":s+" пересадки";
const time=v=>v?String(v).replace("T"," ").replace("Z","").slice(0,16):"Не указано";
function note(v){set(G("note"),v)}
async function ask(cmd){
 if(!key||busy||typeof W.request!=="function"){note("Интерактивность недоступна. Откройте исходную карточку в боте.");return null}
 busy=true;try{const res=await W.request(cmd);return JSON.parse(res.result||"{}")}
 catch(e){note("Не удалось связаться с ботом. Повторите действие.");return null}
 finally{busy=false}
}
function render(){
 G("catalog").classList.remove("hide");G("detail").classList.add("hide");
 const intl=state.m==="discover";
 set(G("brand"),intl?"🌍 ПОДРОБНЫЙ ПОИСК":"🟣 TUTU • АВИАБИЛЕТЫ");
 set(G("heading"),intl?"Билеты за границу":"Подбор рейсов");
 set(G("meta"),state.dt||"");
 set(G("lead"),(state.total||0)+" предложений"+(state.unverified?" • "+state.unverified+" маршрутов не проверено":""));
 G("all").className="chip"+(state.d?"":" on");
 G("direct").className="chip"+(state.d?" on":"");
 G("price").className="chip"+(state.s==="p"?" on":"");
 G("stops").className="chip"+(state.s==="s"?" on":"");
 set(G("cap"),state.d?"Только подтверждённые прямые рейсы":"Доступные варианты");
 G("list").textContent="";
 (state.rows||[]).forEach(r=>{
  const b=mk("button","flight",""),row=mk("div","head",""),title=mk("span","route",r.b||r.a||"Рейс"),price=mk("span","price",money(r.p));
  row.appendChild(title);row.appendChild(price);b.appendChild(row);
  const line=mk("div","secondary",(r.a&&r.b?r.a+" → "+r.b:"")+ (r.t?" • "+time(r.t):""));
  b.appendChild(line);
  const tags=mk("div","tags","");tags.appendChild(mk("span","tag",stops(r.s)));
  if(r.c)tags.appendChild(mk("span","tag",r.c));
  b.appendChild(tags);
  b.addEventListener("click",()=>detail(r));
  G("list").appendChild(b)
 });
 if(!(state.rows||[]).length)G("list").appendChild(mk("div","secondary","Подходящих рейсов нет — измените фильтр."));
 set(G("page"),(state.pg+1)+" / "+state.pages);
 G("prev").disabled=state.pg===0;G("next").disabled=state.pg>=state.pages-1
}
function field(parent,label,value){const e=mk("div","field","");e.appendChild(mk("span","",label));e.appendChild(mk("span","",value));parent.appendChild(e)}
async function detail(r){
 const d=await ask("od:"+key+":"+r.i);
 if(!d)return;
 if(!d.ok){note(d.error||"Не удалось открыть билет");return}
 G("catalog").classList.add("hide");const panel=G("detail");panel.classList.remove("hide");panel.textContent="";
 panel.appendChild(mk("div","brand",state.m==="discover"?"🌍 МЕЖДУНАРОДНЫЙ РЕЙС":"🟣 ВЫБРАННЫЙ БИЛЕТ"));
 panel.appendChild(mk("h2","",d.a+" → "+d.b));
 panel.appendChild(mk("div","bigprice",money(d.p)));
 field(panel,"Вылет",time(d.depart));field(panel,"Прилёт",time(d.arrive));
 field(panel,"Пересадки",stops(d.s));if(d.airline)field(panel,"Перевозчик",d.airline);
 if(d.duration!=null)field(panel,"В пути",Math.floor(d.duration/60)+" ч "+(d.duration%60)+" мин");
 if(d.fare)field(panel,"Тариф",d.fare);
 if(d.bag!==null)field(panel,"Багаж",d.bag===0?"Без багажа":d.bag+" мест"+(d.bagkg!=null?", до "+d.bagkg+" кг":""));
 if(d.hand!==null)field(panel,"Ручная кладь",d.hand+" мест");
 if(d.refund!==null)field(panel,"Возврат",d.refund?"Возможен":"Не предусмотрен");
 if(d.change!==null)field(panel,"Изменение",d.change?"Возможно":"Не предусмотрено");
 const buttons=mk("div","actions","");
 if(d.checkout){const buy=mk("button","primary","🎟 Открыть оформление");buy.addEventListener("click",async()=>{
  const response=await ask("oa:"+key+":"+r.i);if(response)note(response.message||response.error||"Нет ответа");
 });buttons.appendChild(buy)}
 if(d.visa){const visa=mk("button","ghost","ℹ️ Виза");visa.addEventListener("click",()=>showVisa(r));buttons.appendChild(visa)}
 const back=mk("button","ghost","← К списку");back.addEventListener("click",render);buttons.appendChild(back);panel.appendChild(buttons)
}
async function showVisa(r){
 const d=await ask("ov:"+key+":"+r.i);if(!d)return;
 const panel=G("detail");panel.textContent="";
 panel.appendChild(mk("div","brand","ℹ️ ПРАВИЛА ВЪЕЗДА"));
 panel.appendChild(mk("h2","",d.name||r.b));
 panel.appendChild(mk("div","secondary",d.summary||d.error||"Нет данных"));
 const actions=mk("div","actions","");
 if(d.url&&typeof W.openLink==="function"){const link=mk("button","primary","Источник правил");link.addEventListener("click",()=>W.openLink(d.url));actions.appendChild(link)}
 const back=mk("button","ghost","← К билету");back.addEventListener("click",()=>detail(r));actions.appendChild(back);panel.appendChild(actions)
}
async function load(page,direct,sort){
 const result=await ask("of:"+key+":"+page+":"+(direct?1:0)+":"+sort);
 if(result&&result.ok){state=result;render()}
 else if(result)note(result.error||"Не удалось обновить рейсы")
}
G("prev").addEventListener("click",()=>load(state.pg-1,state.d,state.s));
G("next").addEventListener("click",()=>load(state.pg+1,state.d,state.s));
G("all").addEventListener("click",()=>load(0,0,state.s));
G("direct").addEventListener("click",()=>load(0,1,state.s));
G("price").addEventListener("click",()=>load(0,state.d,"p"));
G("stops").addEventListener("click",()=>load(0,state.d,"s"));
render();if(typeof W.ready==="function")W.ready();
})();</script></body></html>
